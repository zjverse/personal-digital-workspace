services:
  workspace:
    build: .
    container_name: personal-digital-workspace
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/workspace.sqlite
      PORT: 4000
      FRONTEND_ORIGIN: "*"
    volumes:
      - ./data:/app/data
    expose:
      - "4000"

  nginx:
    image: nginx:1.27-alpine
    container_name: personal-digital-workspace-nginx
    restart: unless-stopped
    depends_on:
      - workspace
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
