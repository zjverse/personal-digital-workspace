name: personal-digital-workspace

services:
  workspace:
    build: .
    image: personal-digital-workspace:latest
    container_name: personal-digital-workspace
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PATH: /app/data/workspace.sqlite
      FRONTEND_ORIGIN: "*"
    volumes:
      - ./data:/app/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.8-alpine
    container_name: personal-digital-workspace-caddy
    restart: unless-stopped
    profiles:
      - proxy
    depends_on:
      workspace:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
